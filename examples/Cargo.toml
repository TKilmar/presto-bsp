[package]
name = "presto-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
presto-bsp = { path = "../" }
nursery-core = { path = "nursery-core" }

embassy-futures = { version = "0.1.2" }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "defmt",
    "executor-thread",
] }
embassy-rp = { version = "0.10.0", features = [
    "rp235xb",
    "time-driver",
    "unstable-pac",
    "critical-section-impl",
    "binary-info",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime", "defmt"] }
embassy-sync = { version = "0.8.0" }
embedded-hal-async = "1.0"

cortex-m-rt = "0.7.6"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
smart-leds = "0.4"
embedded-alloc = "0.7"
libm = "0.2"
static_cell = "2.1"
heapless = "0.9"
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "dns", "dhcpv4", "dhcpv4-hostname", "medium-ethernet", "proto-ipv4"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.7"
rand_core = "0.9"
fixed = "1.29"

slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = 1
